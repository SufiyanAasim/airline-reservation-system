name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build Verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/AirlineApp/AirlineApp.csproj

      - name: Build solution
        run: dotnet build src/AirlineApp/AirlineApp.csproj -c Release --no-restore

      - name: Verify build artifacts
        run: |
          if (!(Test-Path "src/AirlineApp/bin/Release/net8.0-windows/AirlineApp.exe")) {
            Write-Error "AirlineApp.exe not found after build"
            exit 1
          }
          Write-Host "Build artifact verified: AirlineApp.exe"
        shell: pwsh
