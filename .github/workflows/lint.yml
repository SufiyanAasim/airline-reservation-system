name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Format & Style Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/AirlineApp/AirlineApp.csproj

      - name: Check formatting
        run: dotnet format src/AirlineApp/AirlineApp.csproj --verify-no-changes --severity warn
